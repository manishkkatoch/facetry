<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facetry playground</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
      html, body { margin: 0; height: 100%; }
      #app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto 1fr; height: 100%; }
      #controls { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #8884; white-space: nowrap; }
      #status { margin-left: auto; opacity: 0.7; }
      #camera, #hover { opacity: 0.7; font: 12px ui-monospace, monospace; }
      #camera { margin-left: auto; }
      /* Shrinks (with an ellipsis) instead of wrapping: the bar must not change height as it appears. */
      #hover { margin-left: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      #hover:empty { display: none; }
      #camera:not([hidden]) + #hover + #status, #hover:not(:empty) + #status { margin-left: 12px; }
      #chart-wrap { position: relative; min-width: 0; min-height: 0; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #side { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; min-height: 0; border-left: 1px solid #8884; }
      textarea { flex: 1; min-height: 0; font: 12px/1.4 ui-monospace, monospace; resize: none; }
      #issues { margin: 0; padding-left: 18px; max-height: 30%; overflow: auto; color: #c0392b; font-size: 13px; }
      #issues:empty { display: none; }
      #issues code { font-weight: 600; }
      /* ?ui=0: just the canvas, filling the window (used by the golden-image test). */
      body.embed #app { display: block; }
      body.embed #controls, body.embed #side { display: none; }
      body.embed #chart-wrap { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="controls">
        <label>Example <select id="example"></select></label>
        <label title="How Mermaid diagrams are drawn">Style <select id="style"><option value="flat">flat</option><option value="glossy">glossy</option></select></label>
        <button id="apply" type="button">Apply</button>
        <button id="save-png" type="button" title="Download the chart as it is now (current camera) as a PNG">Save PNG</button>
        <span id="camera" hidden title="Drag to orbit, wheel to zoom, double-click to reset"></span>
        <span id="hover" aria-live="polite" title="The bar under the pointer (hover event)"></span>
        <span id="status">Starting…</span>
      </div>
      <div id="chart-wrap"><canvas id="chart"></canvas></div>
      <div id="side">
        <textarea id="json" spellcheck="false" aria-label="Chart spec (JSON) or Mermaid text"></textarea>
        <ul id="issues" aria-live="polite"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
