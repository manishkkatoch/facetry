[package]
name = "font-atlas"
description = "Offline tool: renders the bundled font into an MSDF atlas PNG + metrics table."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fdsm = "0.8.0"
fdsm-ttf-parser = "0.2.0"
ttf-parser = "0.25.1"
nalgebra = "0.34.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }

# Only the tests read the embedded data back. Not a normal dependency: the tool writes the
# file that facetry-font includes, so building the tool must not need that file to exist.
[dev-dependencies]
facetry-font.workspace = true

[lints]
workspace = true
