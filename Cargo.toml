[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
publish = false

[workspace.dependencies]
facetry-core = { path = "crates/facetry-core" }
facetry-render = { path = "crates/facetry-render" }
wgpu = { version = "30.0.1", default-features = false }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"
console_error_panic_hook = "0.1.7"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimise for download size: the .wasm is what users pay for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
