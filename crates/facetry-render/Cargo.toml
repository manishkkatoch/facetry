[package]
name = "facetry-render"
description = "wgpu renderer: owns the GPU device and surface, draws frames."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# wasm32 only; native builds always use the native APIs and ignore these.
webgpu = ["wgpu/webgpu"]
webgl = ["wgpu/webgl"]

[dependencies]
facetry-core.workspace = true
facetry-font.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12", "gles"] }

# In the browser, wgpu brings its own backends only when asked: `webgpu` is a thin shim over
# the browser's API; `webgl` pulls in wgpu-core, the GL backend and naga (about three
# quarters of a combined module). facetry-wasm is built twice, once with each, and the JS
# loader picks one at runtime (see docs/wasm-size.md). Both may be enabled together.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["std", "wgsl"] }
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }

# Native-only (proptest does not build for wasm32, and `clippy --target wasm32 --all-targets`
# still compiles the tests).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[dev-dependencies]
# Lets the unit tests validate the WGSL and translate it to GLSL ES 3.00 (what WebGL2
# consumes) without a GPU.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }

[lints]
workspace = true
