name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Snapshot tests (insta) fail on any difference and never write .snap.new files. Update
  # snapshots locally with `cargo insta review` or `INSTA_UPDATE=always cargo test`.
  INSTA_UPDATE: "no"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p facetry-core -p facetry-font -p facetry-render -p facetry-wasm -p facetry-diagrams -p facetry-diagrams-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy -p facetry-render -p facetry-wasm --target wasm32-unknown-unknown --all-targets --no-default-features --features webgl -- -D warnings
      - run: cargo test --workspace
      - name: No pending or untracked snapshot files
        run: test -z "$(git status --porcelain)"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@wasm-pack
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build both wasm modules (wasm-pack + wasm-opt) and print sizes
        run: scripts/build-wasm.sh
      - run: pnpm -r build
      - run: pnpm --filter playground exec playwright install --with-deps chromium
      - name: Playwright tests (smoke, playground, golden image)
        run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: examples/playground/test-results
